<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chartink Scanner Terminal</title>
    
    <!-- Bootstrap 5 CSS & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Google Fonts & ApexCharts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        :root {
            --bg-body-dark: #090d16;
            --card-bg-dark: #111827;
            --card-border-dark: #1f2937;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body-dark);
            color: #f3f4f6;
            min-height: 100vh;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background-color: var(--card-bg-dark);
            border: 1px solid var(--card-border-dark);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Scrollable Tab Navigation Bar to prevent overflow off-screen */
        .nav-tabs-scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .nav-tabs-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .nav-tabs-scroll::-webkit-scrollbar-thumb {
            background: var(--card-border-dark);
            border-radius: 4px;
        }

        .nav-pills .nav-link {
            color: #9ca3af;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-pills .nav-link.active {
            background-color: var(--accent-cyan);
            color: #000000;
        }

        .badge-positive {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-negative {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-strategy {
            background-color: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            font-size: 0.75rem;
            margin-right: 4px;
            margin-bottom: 2px;
            display: inline-block;
        }

        .table-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #f3f4f6;
        }

        .table-custom th {
            border-bottom: 2px solid var(--card-border-dark);
            color: #9ca3af;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .table-custom td {
            border-bottom: 1px solid var(--card-border-dark);
            vertical-align: middle;
        }

        .form-select-custom, .form-control-custom {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #f3f4f6;
            border-radius: 8px;
        }

        .form-select-custom:focus, .form-control-custom:focus {
            background-color: #1f2937;
            border-color: var(--accent-cyan);
            color: #f3f4f6;
            box-shadow: 0 0 0 0.25rem rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="p-3 p-md-4">

    <div class="container-fluid">
        <!-- Top Navigation Header -->
        <header class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary border-opacity-25">
            <div class="d-flex align-items-center mb-2 mb-md-0">
                <i class="fa-solid fa-chart-line text-info fs-3 me-3"></i>
                <div>
                    <h4 class="fw-extrabold m-0 text-light">Chartink Terminal</h4>
                    <span class="badge bg-secondary opacity-75 font-mono small" id="last-updated-time">Sync: Initializing...</span>
                </div>
            </div>

            <div class="d-flex gap-2 align-items-center">
                <button id="toggle-scan-btn" onclick="toggleScanner()" class="btn btn-warning btn-sm fw-bold px-3 py-2 rounded-3">
                    <i class="fa-solid fa-pause me-1"></i> Pause
                </button>
                <button onclick="toggleTheme()" class="btn btn-outline-secondary btn-sm px-3 py-2 rounded-3">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
                <button class="btn btn-outline-info btn-sm px-3 py-2 rounded-3" data-bs-toggle="modal" data-bs-target="#soundModal">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <!-- Strategy Tabs Navigation (Scrollable container added) -->
        <ul class="nav nav-pills nav-tabs-scroll gap-2 mb-4" id="scannerTabs">
            <li class="nav-item">
                <button class="nav-link active" onclick="switchTab('intraday', this)">
                    Intraday <span class="badge bg-dark ms-1" id="count-intraday">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('monthly', this)">
                    Monthly <span class="badge bg-dark ms-1" id="count-monthly">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('best_setup', this)">
                    Best Setup <span class="badge bg-dark ms-1" id="count-best">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('strong_vol_hh', this)">
                    Strong Vol HH <span class="badge bg-dark ms-1" id="count-strong-vol">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('liquidity_hunt', this)">
                    Liquidity Hunt <span class="badge bg-dark ms-1" id="count-liq-hunt">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('near_trendline', this)">
                    Near Trendline <span class="badge bg-dark ms-1" id="count-near-trendline">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('market_momentum', this)">
                    Market Momentum <span class="badge bg-dark ms-1" id="count-market-momentum">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link text-warning" onclick="switchTab('super_probability', this)">
                    <i class="fa-solid fa-bolt me-1"></i> Super Prob <span class="badge bg-dark ms-1" id="count-super-prob">0</span>
                </button>
            </li>
        </ul>

        <!-- Strategy Checkbox Controls (Visible only on Super Probability Tab) -->
        <div class="glass-card p-3 mb-4" id="super-prob-filters" style="display: none;">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <label class="form-label text-warning small fw-bold text-uppercase mb-0">
                    <i class="fa-solid fa-filter me-1"></i> Filter Super Probability Setups (Must Match Selected)
                </label>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-info btn-sm py-0 px-2" style="font-size: 0.75rem;" onclick="selectAllSuperCheckboxes(true)">Select All</button>
                    <button class="btn btn-outline-secondary btn-sm py-0 px-2" style="font-size: 0.75rem;" onclick="selectAllSuperCheckboxes(false)">Clear All</button>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-3 pt-1">
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_intraday" value="intraday" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_intraday">Intraday</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_monthly" value="monthly" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_monthly">Monthly</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_best_setup" value="best_setup" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_best_setup">Best Setup</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_strong_vol_hh" value="strong_vol_hh" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_strong_vol_hh">Strong Vol HH</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_liquidity_hunt" value="liquidity_hunt" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_liquidity_hunt">Liquidity Hunt</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_near_trendline" value="near_trendline" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_near_trendline">Near Trendline</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input super-filter-chk" type="checkbox" id="chk_market_momentum" value="market_momentum" onchange="filterData()" checked>
                    <label class="form-check-label text-light small fw-semibold" for="chk_market_momentum">Market Momentum</label>
                </div>
            </div>
        </div>

        <!-- Charts Dashboard Row -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="glass-card p-3">
                    <h6 class="fw-bold text-muted mb-2"><i class="fa-solid fa-chart-bar text-info me-2"></i>Top Gainers (% Chg)</h6>
                    <div id="gainers-chart"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card p-3">
                    <h6 class="fw-bold text-muted mb-2"><i class="fa-solid fa-chart-pie text-success me-2"></i>Volume Distribution</h6>
                    <div id="volume-chart"></div>
                </div>
            </div>
        </div>

        <!-- Filter Tools Bar -->
        <div class="glass-card p-3 mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" onkeyup="filterData()" class="form-control form-control-custom" placeholder="Search by stock or name...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="changeFilter" onchange="filterData()" class="form-select form-select-custom">
                        <option value="all">All % Changes</option>
                        <option value="gainers">Positive Gainers (> 0%)</option>
                        <option value="top_gainers">Top Gainers (> 3%)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" id="priceFilter" onkeyup="filterData()" class="form-control form-control-custom" placeholder="Min Price (₹)">
                </div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="glass-card p-3">
            <div class="table-responsive">
                <table class="table table-custom align-middle">
                    <thead>
                        <tr>
                            <th onclick="sortTable('nsecode')">Symbol <i class="fa-solid fa-sort ms-1"></i></th>
                            <th onclick="sortTable('name')">Name <i class="fa-solid fa-sort ms-1"></i></th>
                            <th onclick="sortTable('close')">Price <i class="fa-solid fa-sort ms-1"></i></th>
                            <th onclick="sortTable('per_chg')">% Change <i class="fa-solid fa-sort ms-1"></i></th>
                            <th onclick="sortTable('volume')">Volume <i class="fa-solid fa-sort ms-1"></i></th>
                            <th id="th-matched-strategies" style="display: none;">Matched Strategies</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Dynamic Stock Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Audio Settings Modal -->
    <div class="modal fade" id="soundModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-sliders text-info me-2"></i>Audio Alert Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="soundToggle" checked>
                        <label class="form-check-label fw-semibold" for="soundToggle">Standard Alert Tone</label>
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="vipSoundToggle" checked>
                        <label class="form-check-label fw-semibold text-warning" for="vipSoundToggle"><i class="fa-solid fa-crown me-1"></i> Best Setup Alert Tone</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold text-uppercase">Standard Tone Style</label>
                        <select id="soundSelect" class="form-select form-select-custom" onchange="playAlertSound('standard')">
                            <option value="chime">Modern Chime</option>
                            <option value="radar">Sonar Radar</option>
                            <option value="bell">Digital Bell</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Volume</label>
                        <input type="range" class="form-range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                    </div>

                    <div class="d-flex gap-2 pt-2 border-top border-secondary border-opacity-25">
                        <button type="button" class="btn btn-outline-info btn-sm w-100 fw-bold" onclick="playAlertSound('standard')">
                            <i class="fa-solid fa-play me-1"></i> Test Standard
                        </button>
                        <button type="button" class="btn btn-outline-warning btn-sm w-100 fw-bold" onclick="playAlertSound('vip')">
                            <i class="fa-solid fa-play me-1"></i> Test VIP Setup
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Main Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentTab = 'intraday';
        let rawData = { intraday: [], monthly: [], best_setup: [], strong_vol_hh: [], liquidity_hunt: [], near_trendline: [], market_momentum: [], super_probability: [] };
        let activeDisplayedData = [];
        let sortDirection = false;
        let isScannerPaused = false;
        let gainersChart, volumeChart;

        let previousStockCounts = { standard: 0, super: 0 };
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        document.addEventListener('click', initAudioContext, { once: true });

        function playAlertSound(type = 'standard') {
            initAudioContext();
            if (!audioCtx) return;

            const isStandardEnabled = document.getElementById('soundToggle')?.checked;
            const isVipEnabled = document.getElementById('vipSoundToggle')?.checked;
            const soundType = document.getElementById('soundSelect')?.value || 'chime';
            const volume = parseFloat(document.getElementById('volumeSlider')?.value || 0.7);

            if (type === 'standard' && !isStandardEnabled) return;
            if (type === 'vip' && !isVipEnabled) return;

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(volume, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'vip') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

                    osc.connect(gain);
                    gain.connect(masterGain);

                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
                return;
            }

            if (soundType === 'radar') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(440, now + 0.25);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.25);

            } else if (soundType === 'bell') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);

                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.6);

            } else {
                [587.33, 880].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);

                    gain.gain.setValueAtTime(0.4, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.35);

                    osc.connect(gain);
                    gain.connect(masterGain);

                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.35);
                });
            }
        }

        function toggleTheme() {
            const htmlTag = document.documentElement;
            const currentTheme = htmlTag.getAttribute('data-bs-theme');
            htmlTag.setAttribute('data-bs-theme', currentTheme === 'dark' ? 'light' : 'dark');
            renderCharts();
        }

        async function toggleScanner() {
            const res = await fetch('/api/toggle-scanner', { method: 'POST' });
            const data = await res.json();
            const btn = document.getElementById('toggle-scan-btn');
            
            if (data.status === 'paused') {
                isScannerPaused = true;
                btn.className = 'btn btn-success btn-sm fw-bold px-3 py-2 rounded-3';
                btn.innerHTML = '<i class="fa-solid fa-play me-1"></i> Resume';
            } else {
                isScannerPaused = false;
                btn.className = 'btn btn-warning btn-sm fw-bold px-3 py-2 rounded-3';
                btn.innerHTML = '<i class="fa-solid fa-pause me-1"></i> Pause';
                fetchScanData();
            }
        }

        function switchTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('#scannerTabs .nav-link').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const strategyHeader = document.getElementById('th-matched-strategies');
            const superProbFilters = document.getElementById('super-prob-filters');

            if (currentTab === 'super_probability') {
                strategyHeader.style.display = 'table-cell';
                superProbFilters.style.display = 'block';
            } else {
                strategyHeader.style.display = 'none';
                superProbFilters.style.display = 'none';
            }

            filterData();
        }

        function selectAllSuperCheckboxes(status) {
            document.querySelectorAll('.super-filter-chk').forEach(chk => chk.checked = status);
            filterData();
        }

        function filterData() {
            let list = [...(rawData[currentTab] || [])];
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const changeFilter = document.getElementById('changeFilter').value;
            const minPrice = parseFloat(document.getElementById('priceFilter').value) || 0;

            if (currentTab === 'super_probability') {
                const selectedStrategies = Array.from(document.querySelectorAll('.super-filter-chk:checked'))
                    .map(chk => chk.value);

                list = list.filter(item => {
                    if (!item.matched_strategies) return false;
                    return selectedStrategies.every(strat => item.matched_strategies.includes(strat));
                });
            }

            if (minPrice > 0) list = list.filter(item => Number(item.close) >= minPrice);
            if (searchTerm) {
                list = list.filter(item => 
                    item.nsecode.toLowerCase().includes(searchTerm) || 
                    item.name.toLowerCase().includes(searchTerm)
                );
            }

            if (changeFilter === 'gainers') list = list.filter(item => item.per_chg > 0);
            else if (changeFilter === 'top_gainers') list = list.filter(item => item.per_chg > 3.0);

            activeDisplayedData = list;
            renderTable(activeDisplayedData);
            renderCharts();
        }

        function sortTable(columnKey) {
            sortDirection = !sortDirection;
            activeDisplayedData.sort((a, b) => {
                let valA = a[columnKey];
                let valB = b[columnKey];
                if (typeof valA === 'string') {
                    return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return sortDirection ? valA - valB : valB - valA;
            });
            renderTable(activeDisplayedData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const isSuperTab = currentTab === 'super_probability';
            const colSpanCount = isSuperTab ? 7 : 6;

            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${colSpanCount}" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-folder-open fs-3 mb-2 opacity-50"></i>
                            <div>No stocks matched the active filters.</div>
                        </td>
                    </tr>`;
                return;
            }

            data.forEach(stock => {
                const isPositive = stock.per_chg >= 0;
                const badgeClass = isPositive ? 'badge-positive' : 'badge-negative';
                const sign = isPositive ? '+' : '';
                const tvLink = `https://www.tradingview.com/chart/?symbol=NSE:${stock.nsecode}`;

                let strategyBadgesHTML = '';
                if (isSuperTab && stock.matched_strategies) {
                    strategyBadgesHTML = `<td>${stock.matched_strategies.map(s => `<span class="badge badge-strategy">${s.replace(/_/g, ' ')}</span>`).join('')}</td>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold font-mono text-info">${stock.nsecode}</td>
                    <td class="fw-semibold">${stock.name}</td>
                    <td class="fw-bold font-mono">₹${Number(stock.close).toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                    <td><span class="badge ${badgeClass} rounded-pill px-3 py-1.5">${sign}${stock.per_chg}%</span></td>
                    <td class="text-muted font-mono">${Number(stock.volume).toLocaleString('en-IN')}</td>
                    ${isSuperTab ? strategyBadgesHTML : ''}
                    <td class="text-end">
                        <a href="${tvLink}" target="_blank" class="btn btn-sm btn-outline-info rounded-pill px-3 py-1 fw-semibold">
                            <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Chart
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCharts() {
            const topGainers = [...activeDisplayedData].sort((a,b) => b.per_chg - a.per_chg).slice(0, 5);
            const topVolume = [...activeDisplayedData].sort((a,b) => b.volume - a.volume).slice(0, 5);
            const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            const textMutedColor = isDark ? '#94a3b8' : '#64748b';

            const gainersOptions = {
                chart: { type: 'bar', height: 300, toolbar: { show: false }, background: 'transparent', fontFamily: 'Plus Jakarta Sans, sans-serif' },
                theme: { mode: isDark ? 'dark' : 'light' },
                series: [{ name: '% Change', data: topGainers.map(s => parseFloat(s.per_chg)) }],
                xaxis: { categories: topGainers.map(s => s.nsecode), labels: { style: { fontFamily: 'JetBrains Mono', colors: textMutedColor } } },
                colors: ['#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7'],
                plotOptions: { bar: { borderRadius: 6, columnWidth: '40%', distributed: true } },
                legend: { show: false },
                dataLabels: { enabled: true, formatter: val => `${val}%` }
            };

            const volumeOptions = {
                chart: { type: 'donut', height: 300, background: 'transparent', fontFamily: 'Plus Jakarta Sans, sans-serif' },
                theme: { mode: isDark ? 'dark' : 'light' },
                series: topVolume.map(s => Number(s.volume)),
                labels: topVolume.map(s => s.nsecode),
                colors: ['#06b6d4', '#10b981', '#f59e0b', '#818cf8', '#f43f5e'],
                legend: { position: 'bottom', labels: { colors: textMutedColor } }
            };

            if (gainersChart) gainersChart.destroy();
            if (volumeChart) volumeChart.destroy();

            gainersChart = new ApexCharts(document.querySelector("#gainers-chart"), gainersOptions);
            volumeChart = new ApexCharts(document.querySelector("#volume-chart"), volumeOptions);
            
            gainersChart.render();
            volumeChart.render();
        }

        async function fetchScanData() {
            if (isScannerPaused) return;

            try {
                const response = await fetch('/api/data');
                const resData = await response.json();

                if (resData.is_paused) return;

                rawData = resData.results;

                const newIntradayCount = rawData.intraday.length;
                const newSuperCount = (rawData.super_probability || []).length;

                if (previousStockCounts.standard !== 0 && newIntradayCount > previousStockCounts.standard) {
                    playAlertSound('standard');
                }
                if (previousStockCounts.super !== 0 && newSuperCount > previousStockCounts.super) {
                    playAlertSound('vip');
                }

                previousStockCounts.standard = newIntradayCount;
                previousStockCounts.super = newSuperCount;

                document.getElementById('count-intraday').innerText = rawData.intraday.length;
                document.getElementById('count-monthly').innerText = rawData.monthly.length;
                document.getElementById('count-best').innerText = rawData.best_setup.length;
                document.getElementById('count-strong-vol').innerText = rawData.strong_vol_hh.length;
                document.getElementById('count-liq-hunt').innerText = rawData.liquidity_hunt.length;
                document.getElementById('count-near-trendline').innerText = (rawData.near_trendline || []).length;
                document.getElementById('count-market-momentum').innerText = (rawData.market_momentum || []).length;
                document.getElementById('count-super-prob').innerText = (rawData.super_probability || []).length;
                document.getElementById('last-updated-time').innerText = `Sync: ${new Date().toLocaleTimeString()}`;

                filterData();
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        setInterval(fetchScanData, 5000);
        fetchScanData();
    </script>
</body>
</html>
